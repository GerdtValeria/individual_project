<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Угол Комфорта — Регистрация</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="logo" aria-hidden="false">
        <a href="/web/" class="logo-link" aria-label="Перейти на главную">
          <img src="/static/img/logo.png" alt="Угол Комфорта логотип">
        </a>
      </div>
    </div>
    <nav class="top-tabs" aria-label="Главная навигация">
      <button class="tab" data-tab="rents">Арендовать</button>
      <button class="tab" data-tab="list"><span class="two-line">Сдать<br>в аренду</span></button>
      <a class="tab" href="/web/favorites">Избранное</a>
      <button class="tab" data-tab="help">Помощь</button>
      <div class="auth">
        <button class="tab active primary" data-tab="signup">Зарегистрироваться</button>
      </div>
    </nav>
  </header>

<main class="container" style="padding:18px;">
  <section style="max-width:700px;margin:0 auto">
    <h1 style="margin:0 0 12px;font-size:28px;color:#042018">Регистрация</h1>
    <p style="color:var(--muted);margin:0 0 18px">
      Создайте аккаунт, чтобы сохранять объявления и управлять бронированиями.
    </p>

    <div class="card" style="padding:18px;max-width:540px;margin:12px auto">
      <!-- id="signupForm" уже правильный -->
      <form id="signupForm" style="display:grid;grid-template-columns:1fr;gap:10px;max-width:540px">
        <label style="display:grid;grid-template-columns:140px 1fr;align-items:center;gap:8px">
          Имя
          <input name="name" required>
        </label>
        <label style="display:grid;grid-template-columns:140px 1fr;align-items:center;gap:8px">
          Электронная почта
          <input name="email" type="email" required>
        </label>
        <label style="display:grid;grid-template-columns:140px 1fr;align-items:center;gap:8px">
          Пароль
          <input name="password" type="password" required>
        </label>
        <div style="grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
          <!-- ВАЖНО: отмена ведёт на /web/, а не на / -->
          <a class="btn" href="/web/" data-nav="home">Отмена</a>
          <button class="btn primary" type="submit">Зарегистрироваться</button>
        </div>
      </form>

      <!-- УБИРАЕМ демо‑сообщение, чтобы форма считалась рабочей -->
      <p style="color:var(--muted);font-size:13px;margin-top:12px">
        После регистрации вы сможете сохранять объявления и управлять бронированиями.
      </p>

      <p style="margin-top:12px;font-size:14px;color:var(--muted);">
        Уже есть аккаунт?
        <a href="#" id="openLogin" style="color:#044036;text-decoration:none;font-weight:700">
          Войти
        </a>
      </p>
    </div>
  </section>
</main>

  <!-- Login modal -->
<div id="loginModal" class="modal" aria-hidden="true">
  <div class="modal-dialog" role="dialog" aria-label="Вход в аккаунт">
    <header class="modal-header">
      <h3>Вход</h3>
    </header>
    <form id="loginForm" class="post-form" style="max-width:420px;">
      <label>Электронная почта
        <input name="email" type="email" required>
      </label>
      <label>Пароль
        <input name="password" type="password" required>
      </label>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <button type="button" id="cancelLogin" class="btn">Отмена</button>
        <button type="submit" class="btn primary">Войти</button>
      </div>
    </form>
  </div>
</div>
    

<script src="/static/js/signup.js"></script>

</body>
</html>
