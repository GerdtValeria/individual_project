<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сдать в аренду</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <!-- ШАПКА -->
  <header class="site-header">
    <a href="/web/index" class="logo-link">
      <span class="logo-text">Угол</span>
    </a>

    <nav class="top-tabs">
      <button class="tab" data-tab="rent">Арендовать</button>
      <button class="tab active" data-tab="list">Сдать в аренду</button>
      <button class="tab" data-tab="favorites">Избранное</button>
      <button class="tab" data-tab="help">Помощь</button>
      <button class="tab" data-tab="signup">Зарегистрироваться</button>
    </nav>
  </header>

  <main class="page page-list">
    <section class="page-title">
      <h1>Сдать жильё в аренду</h1>
      <p>Заполните форму и разместите объявление. После модерации оно появится в общем списке.</p>
    </section>

    <!-- КНОПКА ОТКРЫТИЯ МОДАЛКИ -->
    <section class="new-rent-section">
      <button id="openPostBtn" class="btn primary">Новое объявление</button>
    </section>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ОБЪЯВЛЕНИЯ -->
    <div id="postModalLocal" class="modal-overlay" style="display:none;" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Новое объявление</h2>
          <button id="closePostLocal" class="modal-close" aria-label="Закрыть">×</button>
        </div>

        <div class="modal-body">
          <form id="postFormLocal" enctype="multipart/form-data">
            <div class="form-group">
              <label for="title">Заголовок</label>
              <input id="title" name="title" type="text" required placeholder="Например: Уютная студия в центре" />
            </div>

            <div class="form-group">
              <label for="city">Город</label>
              <input id="city" name="city" type="text" required placeholder="Москва" />
            </div>

            <div class="form-group">
              <label for="description">Описание</label>
              <textarea id="description" name="description" rows="4" required
                        placeholder="Кратко опишите жильё, условия, инфраструктуру рядом"></textarea>
            </div>

            <div class="form-group">
              <label for="category">Категория</label>
              <select id="category" name="category" required>
                <option value="" disabled selected>Выберите категорию</option>
                <option value="Квартира">Квартира</option>
                <option value="Комната">Комната</option>
                <option value="Дом">Дом</option>
                <option value="Апартаменты">Апартаменты</option>
              </select>
            </div>

            <div class="form-group">
              <label for="price">Цена в сутки, ₽</label>
              <input id="price" name="price" type="number" min="1" required placeholder="2500" />
            </div>

            <div class="form-group">
              <label for="photo">Фотография (необязательно)</label>
              <input id="photo" name="photo" type="file" accept="image/*" />
            </div>

            <div class="form-actions">
              <button id="cancelPostLocal" type="button" class="btn secondary">Отмена</button>
              <button type="submit" class="btn primary">Опубликовать</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- БЛОК ПОМОЩИ (для openHelpModal / initHelpBlock) -->
    <div id="helpBlock" class="modal-overlay" style="display:none;" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Помощь</h2>
          <button id="closeHelpBlock" class="modal-close" aria-label="Закрыть">×</button>
        </div>
        <div class="modal-body">
          <p>Если у вас возникли вопросы по размещению объявления, опишите проблему, и мы поможем.</p>
          <form id="helpContactFormList">
            <div class="form-group">
              <label for="helpEmail">Email для ответа</label>
              <input id="helpEmail" name="email" type="email" required />
            </div>
            <div class="form-group">
              <label for="helpMessage">Сообщение</label>
              <textarea id="helpMessage" name="message" rows="4" required></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn primary">Отправить</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <nav>
      <a href="/web/index" data-nav="home">Главная</a>
      <a href="/web/rent" data-nav="rent">Арендовать</a>
      <a href="/web/list" data-nav="list">Сдать</a>
      <a href="/web/favorites" data-nav="favorites">Избранное</a>
      <a href="#" id="footerHelpLink" data-nav="help">Помощь</a>
    </nav>
  </footer>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/list.js"></script>
</body>
</html>
