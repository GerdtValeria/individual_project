<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пользователями</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .header { background: #2c3e50; color: white; padding: 1rem; }
        .nav { display: flex; gap: 1rem; }
        .nav a { color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px; }
        .nav a:hover { background: #34495e; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .user-card { background: white; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .user-header { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
        .role-badge { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .role-user { background: #e3f2fd; color: #1976d2; }
        .role-admin { background: #ffebee; color: #d32f2f; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin: 1rem 0; }
        .stat { text-align: center; padding: 1rem; background: #f8f9fa; border-radius: 6px; }
        .change-role-btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .to-admin { background: #4caf50; color: white; }
        .to-user { background: #ff9800; color: white; }
        .footer { background: #2c3e50; color: white; padding: 2rem 1rem; margin-top: 3rem; }
        .footer-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; max-width: 1200px; margin: 0 auto; }
        .footer-col h4 { margin-bottom: 1rem; }
        .footer-col a { color: #bdc3c7; text-decoration: none; display: block; margin-bottom: 0.5rem; }
        .footer-col a:hover { color: white; }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="/web/rent.html">Арендовать</a>
            <a href="/web/admin-users.html" class="active">Управление пользователями</a>
            <a href="/web/admin-questions.html">Ответы на вопросы</a>
            <a href="/web/profile.html">Профиль</a>
        </nav>
    </header>

    <div class="container">
        <h1>Управление пользователями</h1>
        <div id="users-container">
            <p>Загрузка пользователей...</p>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-cols">
            <div class="footer-col">
                <h4>Меню</h4>
                <a href="/web/rent.html">Арендовать</a>
                <a href="/web/admin-users.html" class="active">Управление пользователями</a>
                <a href="/web/admin-questions.html">Ответы на вопросы</a>
                <a href="/web/profile.html">Профиль</a>
            </div>
            <div class="footer-col">
                <h4>О проекте</h4>
                <a href="http://127.0.0.1:8000/#team">Команда</a>
                <a href="http://127.0.0.1:8000/#history">Наша история</a>
                <a href="http://127.0.0.1:8000/#mission">Миссия проекта</a>
            </div>
            <div class="footer-col">
                <h4>Мы в соцсетях</h4>
                <a href="http://127.0.0.1:8000/web/rents#">ВК</a>
                <a href="http://127.0.0.1:8000/web/rents#">Телеграмм</a>
                <a href="http://127.0.0.1:8000/web/rents#">Одноклассники</a>
            </div>
        </div>
    </footer>

    <script>
        // Загрузка пользователей
        async function loadUsers() {
            try {
                const response = await fetch('http://127.0.0.1:8000/admin/users');
                const users = await response.json();
                
                const container = document.getElementById('users-container');
                container.innerHTML = users.map(user => `
                    <div class="user-card">
                        <div class="user-header">
                            <h3>${user.name} (${user.email})</h3>
                            <span class="role-badge role-${user.role.name}">
                                ${user.role.name === 'admin' ? 'Администратор' : 'Пользователь'}
                            </span>
                            <button class="change-role-btn ${user.role.name === 'admin' ? 'to-user' : 'to-admin'}"
                                    onclick="changeRole(${user.id}, '${user.role.name === 'admin' ? 'user' : 'admin'}')">
                                ${user.role.name === 'admin' ? 'Сделать пользователем' : 'Сделать админом'}
                            </button>
                        </div>
                        <div class="stats">
                            <div class="stat">
                                <strong>${user.rents?.length || 0}</strong><br>Объявления
                            </div>
                            <div class="stat">
                                <strong>${user.bookings?.length || 0}</strong><br>Бронирования
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('users-container').innerHTML = 
                    '<p>Ошибка загрузки пользователей</p>';
            }
        }

        // Смена роли
        async function changeRole(userId, newRole) {
            if (!confirm(`Сделать пользователя ${newRole}?`)) return;
            
            try {
                const response = await fetch(`http://127.0.0.1:8000/admin/users/${userId}/role`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: newRole })
                });
                
                if (response.ok) {
                    loadUsers(); // Перезагрузить список
                }
            } catch (error) {
                alert('Ошибка смены роли');
            }
        }

        // Загрузка при старте
        loadUsers();
    </script>
</body>
</html>
