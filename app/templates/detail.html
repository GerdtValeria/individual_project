<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Угол Комфорта — Объявление</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="Ad">
  <header class="site-header">
    <div class="brand">
      <div class="logo" aria-hidden="false">
        <a href="/index.html" class="logo-link" aria-label="Перейти на главную">
          <img src="/freepik_assistant_1762764092507.png" alt="Угол Комфорта логотип">
        </a>
      </div>
    </div>
    <form id="searchForm" class="search-form" aria-label="Поиск аренды" style="margin-left:12px;">
      <input id="q" name="q" type="search" placeholder="Поиск по городу, району или опции" />
    </form>
    <nav class="top-tabs" aria-label="Главная навигация">
      <button class="tab" data-tab="rent">Арендовать</button>
      <button class="tab" data-tab="list"><span class="two-line">Сдать<br>в аренду</span></button>
      <a class="tab" href="/favorites.html">Избранное</a>
      <button class="tab" data-tab="help">Помощь</button>
      <div class="auth">
        <button class="tab primary" data-tab="signup">Зарегистрироваться</button>
      </div>
    </nav>
  </header>

  <main class="container" style="padding:18px;">
    <section style="max-width:none;margin:0;padding:0;width:100%">
      <div id="detailCard" class="card" style="padding:0;overflow:visible"></div>
    </section>
  </main>

  <footer class="site-footer" aria-label="Сайт футер" style="margin-top:28px">
    <div class="footer-inner">
      <div class="footer-col footer-contact">
        <div class="footer-brand">
          <img src="/freepik_assistant_1762764092507.png" alt="Угол Комфорта логотип" class="footer-logo">
          <div class="company-name">Угол Комфорта</div>
        </div>
      </div>
      <div class="footer-col">
        <h4 class="footer-heading">Меню</h4>
        <ul>
          <li><a href="/rent.html" data-nav="rent">Арендовать</a></li>
          <li><a href="/list.html" data-nav="list">Сдать в аренду</a></li>
          <li><a href="/index.html" data-nav="help">Помощь</a></li>
          <li><a href="/index.html" data-nav="home">Главная</a></li>
          <li><a href="/signup.html" data-nav="signup">Зарегистрироваться</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h4 class="footer-heading">О проекте</h4>
        <ul>
          <li><a href="/index.html#team">Команда</a></li>
          <li><a href="/index.html#history">Наша история</a></li>
          <li><a href="/index.html#mission">Миссия проекта</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h4 class="footer-heading">Мы в соцсетях</h4>
        <ul class="social-list">
          <li><a href="#">ВК</a></li>
          <li><a href="#">Телеграмм</a></li>
          <li><a href="#">Одноклассники</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script type="module">
    import { rentListings } from './js/state.js';
    // wire local search form to redirect to main site search (same behavior as other pages)
    (function(){
      const searchForm = document.getElementById('searchForm');
      if (searchForm) {
        searchForm.addEventListener('submit', (e)=>{
          e.preventDefault();
          const q = (document.getElementById('q')?.value || '').trim();
          const url = q ? `/index.html?q=${encodeURIComponent(q)}` : '/index.html';
          window.location.href = url;
        });
        document.getElementById('q')?.addEventListener('keydown', (ev)=> { if (ev.key === 'Enter') searchForm.requestSubmit(); });
      }
    })();
    
    function qs(name) {
      return new URLSearchParams(location.search).get(name);
    }

    function escapeHtml(s){ return String(s||'').replace(/[&<>\"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])); }

    const id = qs('id');
    const item = (id && rentListings.find(r=>r.id===id)) ? rentListings.find(r=>r.id===id) : (rentListings[0] || null);
    const container = document.getElementById('detailCard');

    if (!item) {
      container.innerHTML = '<div class="card"><div class="card-body"><h3>Объявление не найдено</h3><p style="color:var(--muted)">Проверьте ссылку или вернитесь на главную.</p><p><a class="btn" href="/rent.html">К списку</a></p></div></div>';
    } else {
      // build detail layout following the provided mockup (image left, details right)
      const photos = item.photos && item.photos.length ? item.photos : (item.img ? [item.img] : []);
      const galleryHtml = photos.map((p, idx) => `<img src="${escapeHtml(p)}" alt="${escapeHtml(item.title)}" style="width:100%;height:280px;object-fit:cover;border-radius:8px;display:${idx===0?'block':'none'}" data-idx="${idx}">`).join('');
      container.innerHTML = `
        <div style="display:flex;gap:18px;flex-direction:row;align-items:flex-start;">
          <div style="flex:0 0 48%;display:flex;flex-direction:column;gap:8px">
            <div style="border-radius:12px;overflow:hidden;box-shadow:var(--card-shadow)">${galleryHtml}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
              ${photos.map((p, i)=>`<button class="thumbNav" data-src="${escapeHtml(p)}" aria-label="Показать фото ${i+1}" style="min-width:60px;height:60px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);background-image:url('${escapeHtml(p)}');background-size:cover;background-position:center"></button>`).join('')}
            </div>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;gap:8px">
            <h2 style="margin:0">${escapeHtml(item.title)}</h2>
            <div style="color:var(--muted);font-weight:700">${escapeHtml(item.city)} · ${item.beds === 0 ? 'Студия' : item.beds + ' спальни'}</div>
            <div style="display:flex;gap:12px;align-items:center;margin-top:6px">
              <div style="font-size:20px;font-weight:800;color:#044036">₽${escapeHtml(item.price)}/ночь</div>
            </div>
            <div id="detailDescription" style="margin-top:8px;color:var(--muted)">${escapeHtml(item.description || '')}</div>
            <div style="margin-top:10px">${item.category ? `<span class="tag-pill">${escapeHtml(item.category)}</span>` : ''}</div>

            <!-- Prominent action row -->
            <div style="display:flex;gap:8px;margin-top:auto;align-items:center">
              <button id="bookBtn" class="btn cta">Арендовать</button>
              <button id="saveBtn" class="fav" aria-pressed="false" title="Сохранить"><i data-feather="heart"></i></button>
              <a href="/rent.html" class="btn" style="background:transparent">К списку</a>
            </div>

            <div id="availability" style="margin-top:12px;background:#fbfffe;padding:10px;border-radius:8px;border:1px solid #eef7f4">Доступность: с ${item.avail_from || '—'} до ${item.avail_to || '—'}</div>
          </div>
        </div>
      `;
      // wire gallery thumbnails
      container.querySelectorAll('.thumbNav').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const src = btn.dataset.src;
          const imgs = container.querySelectorAll('img[data-idx]');
          imgs.forEach(img => {
            img.style.display = (img.src === src) ? 'block' : 'none';
          });
        });
      });
      // save recently viewed when opening detail
      (function saveOnce() {
        try {
          const raw = localStorage.getItem('ugol_recent') || '[]';
          const arr = JSON.parse(raw);
          const exists = arr.filter(x=>x.id !== item.id);
          exists.unshift({ id: item.id, title: item.title, img: photos[0] || '', price: item.price, rating: item.rating || null });
          localStorage.setItem('ugol_recent', JSON.stringify(exists.slice(0,8)));
        } catch(e){}
      })();

      // booking button demo
      const bookBtn = document.getElementById('bookBtn');
      if (bookBtn) bookBtn.addEventListener('click', ()=> {
        // перейти на страницу бронирования, передав id текущего объявления
        if (id) {
          window.location.href = `/booking.html?id=${encodeURIComponent(id)}`;
        } else {
          window.location.href = '/booking.html';
        }
      });

      // save button toggles local favorites (icon heart)
      const saveBtn = document.getElementById('saveBtn');
      try {
        const favRaw = localStorage.getItem('ugol_fav') || '[]';
        const fav = new Set(JSON.parse(favRaw).map(x=>x.id));
        function updateSave() {
          const active = fav.has(item.id);
          saveBtn.setAttribute('aria-pressed', active ? 'true' : 'false');
          if (active) saveBtn.classList.add('active'); else saveBtn.classList.remove('active');
          if (window.feather) feather.replace();
        }
        updateSave();
        saveBtn.addEventListener('click', ()=>{
          if (fav.has(item.id)) fav.delete(item.id); else fav.add(item.id);
          localStorage.setItem('ugol_fav', JSON.stringify(Array.from(fav).map(id=>({id}))));
          updateSave();
        });
      } catch(e){}
    }

    // -----------------------------
    // Похожие варианты: ищем похожие объявления по городу и/или похожему количеству спален.
    // Комментарии ниже объясняют логику и процесс рендера.
    // -----------------------------
    (function renderSimilar() {
      // find container where to append the "Похожие варианты" block (below detailCard)
      const parentSection = document.querySelector('main section');
      if (!parentSection) return;

      // Helper: compute similarity score and pick up to 4 best matches (excluding current item)
      // Сначала фильтруем по тому же городу, затем по близкому числу спален, затем по цене.
      const currentId = id;
      const candidates = rentListings.filter(r => r.id !== currentId);
      // compute simple score
      const scored = candidates.map(r => {
        let score = 0;
        if (r.city && item.city && r.city.toLowerCase() === item.city.toLowerCase()) score += 30;
        // beds match or both studios
        if (r.beds === item.beds) score += 20;
        else if (Math.abs((r.beds||0) - (item.beds||0)) === 1) score += 10;
        // price proximity: smaller difference -> higher score
        const priceDiff = Math.abs((r.price||0) - (item.price||0));
        score += Math.max(0, 15 - Math.floor(priceDiff / 20));
        // rating bonus
        score += (r.rating || 0);
        return { r, score };
      });
      scored.sort((a,b) => b.score - a.score);
      const top = scored.slice(0,4).map(s => s.r);
      // build block HTML (cards reuse ad-card styles for compactness)
      const block = document.createElement('section');
      block.className = 'card';
      // make similar block full width
      block.style.padding = '12px';
      block.style.maxWidth = '100%';
      block.style.margin = '12px 0 0';
      block.innerHTML = `
        <h3 style="margin:0 0 8px;color:#042018">Похожие варианты</h3>
        <div id="similarList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px"></div>
      `;
      parentSection.appendChild(block);

      const listEl = document.getElementById('similarList');
      if (!listEl) return;

      if (!top.length) {
        listEl.innerHTML = `<div style="color:var(--muted)">Похожих вариантов не найдено.</div>`;
        return;
      }

      // render each similar item as a compact card and wire "Подробнее" to navigate to its detail page
      top.forEach(sim => {
        const card = document.createElement('article');
        card.className = 'ad-card';
        card.style.minHeight = '120px';
        card.innerHTML = `
          <div class="ad-media" role="img" aria-hidden="true" style="background-image:url('${escapeHtml((sim.photos && sim.photos[0]) || sim.img || '/1686570026_staisha-top-p-dizain-otdelki-kvartiri-v-sovremennom-stil-26.jpg')}')"></div>
          <div class="ad-body">
            <h4 class="ad-title">${escapeHtml(sim.title)}</h4>
            <p class="ad-desc">${escapeHtml(sim.city)} · ${sim.beds === 0 ? 'Студия' : sim.beds + 'к'}</p>
            <div class="ad-actions">
              <button class="btn ad-cta similar-open" data-id="${escapeHtml(sim.id)}">Подробнее</button>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });

      // clicking a similar card navigates to that listing's detail page
      listEl.querySelectorAll('.similar-open').forEach(btn=>{
        btn.addEventListener('click', (e)=> {
          const nid = btn.dataset.id;
          if (!nid) return;
          // navigate to the other detail page (full page load) — keeps URL param in sync
          window.location.href = `/detail.html?id=${encodeURIComponent(nid)}`;
        });
      });
    })();

    // NEW: Reviews block — render existing reviews and allow adding a new one (stored in localStorage)
    (function renderReviews() {
      const parentSection = document.querySelector('main section');
      if (!parentSection) return;

      function loadReviews(listingId) {
        try {
          const raw = localStorage.getItem('ugol_reviews') || '{}';
          const all = JSON.parse(raw);
          return Array.isArray(all[listingId]) ? all[listingId] : [];
        } catch (e) { return []; }
      }
      function saveReview(listingId, review) {
        try {
          const raw = localStorage.getItem('ugol_reviews') || '{}';
          const all = JSON.parse(raw);
          all[listingId] = all[listingId] || [];
          all[listingId].unshift(review);
          // keep recent 50
          all[listingId] = all[listingId].slice(0,50);
          localStorage.setItem('ugol_reviews', JSON.stringify(all));
        } catch (e) {}
      }
      // sample placeholder reviews to show when none exist
      const sample = [
        { author: 'Анна', text: 'Очень уютная квартира, были в восторге — отличное расположение.' },
        { author: 'Михаил', text: 'Чисто и комфортно, небольшие замечания по посуде.' }
      ];

      const reviews = loadReviews(item.id);
      const block = document.createElement('section');
      block.className = 'card';
      block.style.padding = '12px';
      block.style.maxWidth = '100%';
      block.style.margin = '12px 0 20px';
      block.innerHTML = `
        <h3 style="margin:0 0 8px;color:#042018">Отзывы</h3>
        <div id="reviewsList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:12px">
          ${ (reviews.length ? reviews : sample).map(r => `
            <div style="background:#fbfffe;padding:10px;border-radius:8px;border:1px solid #eef7f4">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <strong style="font-size:14px">${escapeHtml(r.author || 'Гость')}</strong>
              </div>
              <div style="color:var(--muted);margin-top:6px">${escapeHtml(r.text||'')}</div>
            </div>
          `).join('') }
        </div>

        <form id="reviewForm" style="display:flex;flex-direction:column;gap:8px;max-width:560px">
          <label style="font-size:13px">Ваше имя
            <input name="author" type="text" placeholder="Имя" style="padding:8px;border-radius:8px;border:1px solid rgba(0,0,0,0.08)">
          </label>
          <label style="font-size:13px">Отзыв
            <textarea name="text" rows="3" placeholder="Расскажите о вашем опыте" style="padding:8px;border-radius:8px;border:1px solid rgba(0,0,0,0.08)"></textarea>
          </label>
          <div style="display:flex;justify-content:flex-end;gap:8px">
            <button type="submit" class="btn">Добавить отзыв</button>
          </div>
        </form>
      `;
      parentSection.appendChild(block);

      const listEl = document.getElementById('reviewsList');
      const form = block.querySelector('#reviewForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const fm = new FormData(form);
        const author = (fm.get('author') || 'Гость').toString().trim();
        const text = (fm.get('text') || '').toString().trim();
        const review = { author, text, created: new Date().toISOString() };
        saveReview(item.id, review);
        // prepend review to UI
        const node = document.createElement('div');
        node.style.cssText = 'background:#fbfffe;padding:10px;border-radius:8px;border:1px solid #eef7f4';
        node.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><strong style="font-size:14px">${escapeHtml(author)}</strong></div><div style="color:var(--muted);margin-top:6px">${escapeHtml(text)}</div>`;
        listEl.insertBefore(node, listEl.firstChild);
        form.reset();
        // optional small confirmation
        alert('Спасибо — ваш отзыв добавлен (локально, демо).');
      });
    })();
  </script>

  <script src="https://unpkg.com/feather-icons/dist/feather.min.js"></script>
  <script type="module" src="/js/signup-handler.js"></script>
</body>
</html>
