<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аренда - Здесь собраны доступные варианты</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="container">
            <a href="/web/" class="logo-link">
                <img src="/static/logo.png" alt="Логотип" class="logo">
            </a>
            
            <nav class="top-tabs">
                <button class="tab active" data-tab="rent">Аренда</button>
                <button class="tab" data-tab="list">Продажа</button>
                <button class="tab" data-tab="favorites">Избранное</button>
                <button class="tab" data-tab="help">Помощь</button>
            </nav>
            
            <div class="auth">
                <button id="registerBtn">Зарегистрироваться</button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="main">
        <div class="container">
            <!-- Заголовок и поиск -->
            <section class="hero">
                <h1>Здесь собраны доступные для аренды варианты</h1>
                <p>Используйте фильтры и карточки объявлений для деталей и бронирования</p>
                
                <form id="searchForm" class="search-form">
                    <input type="text" id="searchInput" placeholder="Поиск по адресу, названию...">
                    <button type="submit">Найти</button>
                </form>
            </section>

            <!-- Карусель категорий - ДИНАМИЧЕСКАЯ -->
            <section class="categories-section">
                <h2>Категории</h2>
                <div class="categories-carousel">
                    <!-- Категории будут загружены динамически из /categories/ API -->
                    <div class="categories-list loading">
                        <div class="category-item skeleton"></div>
                        <div class="category-item skeleton"></div>
                        <div class="category-item skeleton"></div>
                        <div class="category-item skeleton"></div>
                        <div class="category-item skeleton"></div>
                    </div>
                </div>
            </section>

            <!-- Список объявлений -->
            <section class="rentings-section">
                <div class="section-header">
                    <h2>Доступные варианты аренды</h2>
                    <div class="sort-controls">
                        <select id="sortSelect">
                            <option value="price_asc">Цена: по возрастанию</option>
                            <option value="price_desc">Цена: по убыванию</option>
                            <option value="date_desc">Новее сначала</option>
                        </select>
                    </div>
                </div>
                
                <div id="rentListings" class="rent-grid loading">
                    <div class="rent-card skeleton"></div>
                    <div class="rent-card skeleton"></div>
                    <div class="rent-card skeleton"></div>
                </div>
                
                <div id="errorContainer" class="error-container" style="display: none;"></div>
            </section>
        </div>
    </main>

    <!-- Футер -->
    <footer class="footer">
        <div class="container">
            <p>Здесь вы найдёте ответы на частые вопросы, инструкции по бронированию и контакты службы поддержки.</p>
        </div>
    </footer>

    <!-- Модальное окно помощи -->
    <div id="helpModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Помощь</h3>
            <p>Частые вопросы и поддержка</p>
        </div>
    </div>

    <script src="/static/rent.js"></script>
</body>
</html>
